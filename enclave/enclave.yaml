# Enclave configuration
# Edit this file then run: enclave init

name: my-app                     # App name (used in stack name, EIF name)
version: 0.0.1                   # Build version (semver, baked into binary via ldflags)
region: us-east-1                # AWS region
account: "000000000000"                      # AWS account ID (required)
prefix: dev                      # Deployment prefix (stack = {prefix}Nitro{Name})
instance_type: m6i.xlarge        # EC2 instance type
nix_image: nixos/nix:2.24.9      # Docker image for reproducible builds

# SDK coordinates for the enclave supervisor binary.
# The supervisor handles attestation, secrets, PCR extension, and signing
# middleware automatically. Your app is a plain HTTP server with zero SDK imports.
sdk:
  rev: "v0.0.50"
  hash: "sha256-U9Gfre4eZSMNSEel4Gv1d8zXq5nsqhJ7/D8czBGVBnA="
  vendor_hash: "sha256-pn7BpRe6csX8LnK5NEGXktC+RkoaKg/ZZpJ6SLcP1dE="

app:
  language: "go"                 # App language: go, nodejs
  source: nix                    # "nix" = fetch from GitHub via Nix

  # GitHub coordinates for the app to run inside the enclave.
  # Your app is a plain HTTP server that listens on ENCLAVE_APP_PORT (default 7074).
  # Secrets are passed as environment variables. No SDK imports needed.
  nix_owner: "aruokhai"                  # GitHub owner (required)
  nix_repo: "introspector"                   # GitHub repo name (required)
  nix_rev: "307ff74550e1bd7034a990e39228daecf953bb54"                    # Git commit SHA (required)
  nix_hash: "sha256-xU9Wgzmwm6uwoSY67BFoojKFWjLbap3ySj3E++1NljQ="                   # Nix source hash: nix-prefetch-url --unpack (required)
  nix_vendor_hash: "sha256-w7Ih56HsQ9ZIlDqoyH3QHNyyGkS7VGrdP6FrE65V+jg="            # Go vendor hash (required)
  nix_sub_packages:              # Go sub-packages to build
    - "cmd"
  binary_name: introspector                # Output binary name (defaults to 'name')

  # Environment variables baked into the EIF.
  # Template vars: {{region}}, {{prefix}}, {{version}}
  env:
    INTROSPECTOR_PORT: "7074"
    INTROSPECTOR_NO_TLS: "true"
    INTROSPECTOR_DATADIR: "/app/data"
    AWS_ENDPOINT_URL_KMS: "http://kms-proxy:4000"
    ENCLAVE_KMS_KEY_ID: "arn:aws:kms:us-east-1:123456789012:key/test-key-id"
    AWS_ENDPOINT_URL_SSM: "http://localstack:4566"
    AWS_ENDPOINT_URL_STS: "http://localstack:4566"
    AWS_ENDPOINT_URL_S3: "http://localstack:4566"
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"


# Secrets managed by KMS inside the enclave.
# Each secret is generated as 32 random bytes, encrypted with KMS,
# stored in SSM, and decrypted at boot via attestation.
# The decrypted value (hex-encoded) is set as the specified env var.
secrets:
  - name: signing_key
    env_var: INTROSPECTOR_SECRET_KEY
    